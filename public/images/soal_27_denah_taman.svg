<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <rect width="480" height="240" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Taman rumput hijau: 20m x 12m -> 280px x 168px -->
  <rect x="100" y="34" width="280" height="168" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5"/>
  <!-- Kolam ikan persegi di tengah: 4m x 4m -> 56px x 56px -->
  <rect x="212" y="90" width="56" height="56" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <text x="240" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Kolam</text>
  <text x="240" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">4 m</text>
  <text x="276" y="122" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">4 m</text>
  <!-- Label Taman -->
  <text x="155" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Area Rumput</text>
  <text x="240" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">20 m</text>
  <text x="392" y="122" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">12 m</text>
</svg>
