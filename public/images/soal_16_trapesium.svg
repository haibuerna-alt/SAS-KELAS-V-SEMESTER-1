<svg xmlns="http://www.w3.org/2000/svg" width="460" height="230" viewBox="0 0 460 230">
  <rect width="460" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Trapesium sama kaki: atas (160,54)-(300,54), bawah (100,174)-(360,174) -->
  <polygon points="160,54 300,54 360,174 100,174" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
  <!-- Garis tinggi putus-putus -->
  <line x1="160" y1="54" x2="160" y2="174" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <polyline points="160,160 174,160 174,174" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <!-- Label -->
  <text x="230" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">10 cm</text>
  <text x="230" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">18 cm</text>
  <text x="168" y="120" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">t = 8 cm</text>
