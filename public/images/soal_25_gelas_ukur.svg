<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230">
  <rect width="480" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Gelas Ukur Isi Air (Kapasitas Maksimal 1 Liter)</text>
  <!-- Gelas A: 3/5 = 60% penuh. Tinggi gelas = 125px (y=55..180), air = 75px (y=105..180) -->
  <g transform="translate(95, 50)">
    <rect x="0" y="55" width="90" height="75" fill="#60a5fa" opacity="0.85"/>
    <rect x="0" y="0" width="90" height="130" rx="6" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Skala 5 bagian (tiap 26px) -->
    <line x1="0" y1="26" x2="18" y2="26" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="18" y2="52" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="78" x2="18" y2="78" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="104" x2="18" y2="104" stroke="#475569" stroke-width="1.5"/>
    <text x="45" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3/5 L</text>
    <text x="45" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Gelas A</text>
  </g>
  <!-- Gelas B: 1/4 = 25% penuh. Tinggi gelas = 130px, air = 32.5px (y=97.5..130) -->
  <g transform="translate(295, 50)">
    <rect x="0" y="97" width="90" height="33" fill="#34d399" opacity="0.85"/>
    <rect x="0" y="0" width="90" height="130" rx="6" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Skala 4 bagian (tiap 32.5px) -->
    <line x1="0" y1="32.5" x2="18" y2="32.5" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="65" x2="18" y2="65" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="97.5" x2="18" y2="97.5" stroke="#475569" stroke-width="1.5"/>
    <text x="45" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#064e3b">1/4 L</text>
    <text x="45" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Gelas B</text>
  </g>
</svg>
