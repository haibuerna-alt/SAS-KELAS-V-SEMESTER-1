<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250">
  <rect width="460" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Layang-layang KLMN: K(230,34), L(310,88), M(230,214), N(150,88) -->
  <polygon points="230,34 310,88 230,214 150,88" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <!-- Diagonal putus-putus -->
  <line x1="150" y1="88" x2="310" y2="88" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4"/>
  <line x1="230" y1="34" x2="230" y2="214" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4"/>
  <!-- Titik sudut -->
  <text x="230" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">K</text>
  <text x="322" y="92" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L</text>
  <text x="230" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">M</text>
  <text x="138" y="92" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">N</text>
  <!-- Label sisi & diagonal -->
  <text x="280" y="54" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">10 cm</text>
  <text x="282" y="164" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">17 cm</text>
  <text x="190" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">LN = 16 cm</text>
  <text x="236" y="142" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">KM = 21 cm</text>
</svg>
